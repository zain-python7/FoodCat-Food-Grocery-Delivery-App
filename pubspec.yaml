name: foodcat
description: FoodCat food and grocery delivery ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  provider: ^6.1.5
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/design/customer/
    - assets/design/partner/
    - assets/design/rider/
    - assets/design/admin/
    - assets/branding/
    - assets/images/products/
    - assets/images/restaurants/

# Run `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`
# after `flutter pub get` to generate native launcher and splash resources.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/foodcat_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/foodcat_icon_foreground.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/foodcat_splash.png
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: assets/branding/foodcat_icon_foreground.png
