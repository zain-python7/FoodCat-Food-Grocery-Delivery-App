<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <!-- Dimmed Background -->
  <rect width="390" height="844" fill="#1A1C20"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <!-- Bottom Sheet Container -->
  <path d="M0,78 Q0,58 20,58 L370,58 Q390,58 390,78 L390,844 L0,844 Z" fill="#FFFFFF"/>
  <!-- Close Button -->
  <circle cx="354" cy="90" r="16" fill="#F7F7F7"/>
  <text x="354" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">✕</text>

  <!-- Product Banner -->
  <rect x="16" y="118" width="358" height="140" rx="14" fill="#FFF0F6"/>
  <circle cx="195" cy="188" r="46" fill="#F5A623"/>
  <rect x="145" y="182" width="100" height="14" rx="7" fill="#6D3B1E"/>

  <!-- Item Title & Price -->
  <g transform="translate(16, 276)">
    <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#1A1C20">Double Whisker Smash Burger</text>
    <text x="358" y="20" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Rs. 890</text>
    <text x="0" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#70757A">Two smashed beef patties, double cheddar, pickles &amp; house cat sauce on a toasted brioche bun.</text>
  </g>

  <line x1="16" y1="348" x2="374" y2="348" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Required Group: Choose Size -->
  <g transform="translate(16, 366)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Choose your meal option</text>
    <rect x="282" y="0" width="76" height="24" rx="12" fill="#E21B70"/>
    <text x="320" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Required</text>

    <!-- Option 1 Selected -->
    <g transform="translate(0, 38)">
      <circle cx="11" cy="11" r="10" fill="none" stroke="#E21B70" stroke-width="2"/>
      <circle cx="11" cy="11" r="5" fill="#E21B70"/>
      <text x="32" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">Burger Only</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#70757A">Free</text>
    </g>

    <!-- Option 2 -->
    <g transform="translate(0, 76)">
      <circle cx="11" cy="11" r="10" fill="none" stroke="#CCCCCC" stroke-width="2"/>
      <text x="32" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">Make it a Meal (Fries + Drink)</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#1A1C20">+ Rs. 320</text>
    </g>
  </g>

  <line x1="16" y1="486" x2="374" y2="486" stroke="#EFEFEF" stroke-width="1"/>

  <!-- Optional Add-ons -->
  <g transform="translate(16, 504)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Extra Toppings</text>
    <rect x="286" y="0" width="72" height="24" rx="12" fill="#F2F2F2"/>
    <text x="322" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="11" fill="#70757A">Optional</text>

    <g transform="translate(0, 38)">
      <rect x="1" y="1" width="20" height="20" rx="4" fill="#E21B70"/>
      <path d="M5,11 L9,15 L17,7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <text x="32" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">Extra Cheddar Slice</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#1A1C20">+ Rs. 120</text>
    </g>

    <g transform="translate(0, 76)">
      <rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="#CCCCCC" stroke-width="2"/>
      <text x="32" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">Extra Secret Cat Sauce</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#1A1C20">+ Rs. 80</text>
    </g>

    <g transform="translate(0, 114)">
      <rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="#CCCCCC" stroke-width="2"/>
      <text x="32" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">Jalapenos</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#1A1C20">+ Rs. 60</text>
    </g>
  </g>

  <!-- Sticky Bottom Action Bar -->
  <g transform="translate(0, 756)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="88" fill="#FFFFFF"/>
    <!-- Stepper -->
    <g transform="translate(16, 18)">
      <circle cx="18" cy="24" r="18" fill="#F7F7F7"/>
      <text x="18" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#70757A">−</text>
      <text x="54" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">1</text>
      <circle cx="90" cy="24" r="18" fill="#FFF0F6"/>
      <text x="90" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">+</text>
    </g>
    <!-- Add to cart CTA -->
    <rect x="132" y="18" width="242" height="48" rx="10" fill="#E21B70"/>
    <text x="253" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Add to cart • Rs. 1,010</text>
  </g>
</svg>