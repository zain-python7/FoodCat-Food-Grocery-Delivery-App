<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#E21B70"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <!-- Subtle decorative circles -->
  <circle cx="350" cy="140" r="90" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="40" cy="700" r="120" fill="#FFFFFF" opacity="0.06"/>

  <!-- Center Brand Lockup -->
  <g transform="translate(195, 370)">
    <circle cx="0" cy="-35" r="68" fill="#FFFFFF"/>
    <circle cx="0" cy="-35" r="61" fill="none" stroke="#E21B70" stroke-width="3"/>
    <g transform="translate(0, -35) scale(2.1)">
      
  <g id="foodcat-mascot">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#E21B70" stroke-width="2"/>
    <!-- Ears -->
    <polygon points="-14,-8 -16,-20 -5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="14,-8 16,-20 5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="1" rx="16" ry="13" fill="#FAD2E1" stroke="#2E3138" stroke-width="1.5"/>
    <ellipse cx="0" cy="5" rx="11" ry="8" fill="#FFFFFF"/>
    <!-- Cap -->
    <path d="M-8,-11 C-8,-17 8,-17 8,-11 Z" fill="#2E3138"/>
    <rect x="-10" y="-12" width="20" height="3" rx="1.5" fill="#E21B70"/>
    <!-- Eyes -->
    <circle cx="-6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="-6.8" cy="-0.8" r="1" fill="#FFFFFF"/>
    <circle cx="6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="5.2" cy="-0.8" r="1" fill="#FFFFFF"/>
    <!-- Nose & Smile -->
    <polygon points="-2,3 2,3 0,5.5" fill="#E21B70"/>
    <path d="M-4,6.5 Q-2,9 0,6.5 Q2,9 4,6.5" fill="none" stroke="#2E3138" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="-10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
    <ellipse cx="10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
  </g>

    </g>
    <text x="0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" letter-spacing="-1">foodcat</text>
    <text x="0" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#FFE3EE" letter-spacing="2">FOOD &amp; GROCERY DELIVERY</text>
  </g>

  <!-- Loading indicator -->
  <g transform="translate(171, 750)">
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    <circle cx="24" cy="0" r="4.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="48" cy="0" r="4.5" fill="#FFFFFF" opacity="0.3"/>
  </g>
  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85"/>
</svg>