<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFFFFF"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#1A1C20"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#1A1C20"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#1A1C20"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#1A1C20" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#1A1C20" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#1A1C20"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#1A1C20"/>
  </g>


  <!-- Map Illustration Hero -->
  <g transform="translate(0, 44)">
    <rect x="0" y="0" width="390" height="380" fill="#FFF0F6"/>
    <!-- Stylized Map Roads -->
    <path d="M-20,110 Q140,80 220,170 T410,220" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <path d="M90,-10 L150,390" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M270,-10 L210,390" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    <rect x="40" y="160" width="75" height="55" rx="8" fill="#FAD2E1" opacity="0.6"/>
    <rect x="255" y="70" width="85" height="60" rx="8" fill="#FAD2E1" opacity="0.6"/>

    <!-- Center Pin with Foodcat Mascot -->
    <g transform="translate(195, 195)">
      <ellipse cx="0" cy="54" rx="28" ry="8" fill="#E21B70" opacity="0.2"/>
      <path d="M0,52 C-28,22 -46,-2 -46,-28 A46,46 0 1,1 46,-28 C46,-2 28,22 0,52 Z" fill="#E21B70"/>
      <g transform="translate(0, -28) scale(1.45)">
        
  <g id="foodcat-mascot">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#E21B70" stroke-width="2"/>
    <!-- Ears -->
    <polygon points="-14,-8 -16,-20 -5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="14,-8 16,-20 5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="1" rx="16" ry="13" fill="#FAD2E1" stroke="#2E3138" stroke-width="1.5"/>
    <ellipse cx="0" cy="5" rx="11" ry="8" fill="#FFFFFF"/>
    <!-- Cap -->
    <path d="M-8,-11 C-8,-17 8,-17 8,-11 Z" fill="#2E3138"/>
    <rect x="-10" y="-12" width="20" height="3" rx="1.5" fill="#E21B70"/>
    <!-- Eyes -->
    <circle cx="-6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="-6.8" cy="-0.8" r="1" fill="#FFFFFF"/>
    <circle cx="6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="5.2" cy="-0.8" r="1" fill="#FFFFFF"/>
    <!-- Nose & Smile -->
    <polygon points="-2,3 2,3 0,5.5" fill="#E21B70"/>
    <path d="M-4,6.5 Q-2,9 0,6.5 Q2,9 4,6.5" fill="none" stroke="#2E3138" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="-10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
    <ellipse cx="10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
  </g>

      </g>
    </g>
  </g>

  <!-- Content Sheet -->
  <g transform="translate(24, 455)">
    <text x="0" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#1A1C20">Allow location access on</text>
    <text x="0" y="54" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#1A1C20">the next screen for:</text>

    <!-- Bullet 1 -->
    <g transform="translate(0, 82)">
      <circle cx="18" cy="18" r="18" fill="#FFF0F6"/>
      <circle cx="18" cy="18" r="7" fill="#E21B70"/>
      <text x="48" y="15" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">Finding the best restaurants and</text>
      <text x="48" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">shops near you</text>
    </g>

    <!-- Bullet 2 -->
    <g transform="translate(0, 142)">
      <circle cx="18" cy="18" r="18" fill="#FFF0F6"/>
      <rect x="11" y="12" width="14" height="12" rx="2" fill="#E21B70"/>
      <text x="48" y="15" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">Faster and more accurate delivery</text>
      <text x="48" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">straight to your doorstep</text>
    </g>

    <!-- Primary CTA Button -->
    <rect x="0" y="220" width="342" height="50" rx="10" fill="#E21B70"/>
    <text x="171" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Share my current location</text>

    <!-- Secondary Link -->
    <text x="171" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">Enter address manually</text>
  </g>
</svg>