      <circle cx="254" cy="32" r="18" fill="#D8F3DC"/>
      <text x="254" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Healthy</text>

      <rect x="296" y="0" width="64" height="64" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="328" cy="32" r="18" fill="#E0AAFF"/>
      <text x="328" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Desserts</text>
