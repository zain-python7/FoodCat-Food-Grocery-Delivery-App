<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFFFFF"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#1A1C20"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#1A1C20"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#1A1C20"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#1A1C20" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#1A1C20" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#1A1C20"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#1A1C20"/>
  </g>


  <!-- Search Header -->
  <g transform="translate(16, 48)">
    <rect x="0" y="0" width="358" height="42" rx="21" fill="#F7F7F7" stroke="#E21B70" stroke-width="1.5"/>
    <text x="18" y="26" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="13" fill="#1A1C20">🔍  Burger</text>
    <circle cx="336" cy="21" r="10" fill="#CCCCCC"/>
    <text x="336" y="25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">✕</text>
  </g>

  <!-- Recent Searches -->
  <g transform="translate(16, 114)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Recent searches</text>
    <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#E21B70">Clear</text>

    <g transform="translate(0, 34)">
      <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">🕒  Smash Burger</text>
      <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#70757A">↖</text>
      <line x1="0" y1="30" x2="358" y2="30" stroke="#F2F2F2"/>

      <text x="0" y="54" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">🕒  Chicken Biryani</text>
      <text x="358" y="54" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#70757A">↖</text>
      <line x1="0" y1="68" x2="358" y2="68" stroke="#F2F2F2"/>

      <text x="0" y="92" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#1A1C20">🕒  Catmart Milk &amp; Bread</text>
      <text x="358" y="92" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#70757A">↖</text>
    </g>
  </g>

  <!-- Popular Searches Pills -->
  <g transform="translate(16, 268)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Popular searches</text>

    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="84" height="34" rx="17" fill="#FFF0F6" stroke="#FAD2E1"/>
      <text x="42" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">🔥 Pizza</text>

      <rect x="92" y="0" width="96" height="34" rx="17" fill="#F7F7F7" stroke="#E0E0E0"/>
      <text x="140" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Shawarma</text>

      <rect x="196" y="0" width="88" height="34" rx="17" fill="#F7F7F7" stroke="#E0E0E0"/>
      <text x="240" y="22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Ice Cream</text>

      <rect x="0" y="44" width="102" height="34" rx="17" fill="#F7F7F7" stroke="#E0E0E0"/>
      <text x="51" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Zinger Deal</text>

      <rect x="110" y="44" width="82" height="34" rx="17" fill="#F7F7F7" stroke="#E0E0E0"/>
      <text x="151" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Momos</text>

      <rect x="200" y="44" width="110" height="34" rx="17" fill="#F7F7F7" stroke="#E0E0E0"/>
      <text x="255" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Cold Coffee</text>
    </g>
  </g>

  <!-- Quick Cuisine Tiles -->
  <g transform="translate(16, 412)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Explore categories</text>

    <rect x="0" y="30" width="173" height="74" rx="12" fill="#FFF0F6"/>
    <text x="16" y="62" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">Deals &amp; Offers</text>
    <text x="16" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#E21B70">Up to 50% off</text>

    <rect x="185" y="30" width="173" height="74" rx="12" fill="#FEF3C7"/>
    <text x="201" y="62" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">Late Night</text>
    <text x="201" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">Open till 3 AM</text>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EFEFEF" stroke-width="1"/>

    <g transform="translate(48, 14)">
      <path d="M12 3L4 9v12h16V9l-8-6z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Food</text>
    </g>

    <g transform="translate(140, 14)">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Grocery</text>
    </g>

    <g transform="translate(235, 14)">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#E21B70" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">Search</text>
    </g>

    <g transform="translate(330, 14)">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Account</text>
    </g>
  </g>

</svg>