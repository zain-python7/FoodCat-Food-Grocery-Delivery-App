<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFFFFF"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#1A1C20"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#1A1C20"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#1A1C20"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#1A1C20" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#1A1C20" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#1A1C20"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#1A1C20"/>
  </g>


  <!-- Top Navigation Bar -->
  <g transform="translate(16, 48)">
    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="#E21B70"/>
    <text x="36" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Restaurants</text>
    <text x="36" y="31" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">Main Boulevard, Gulberg III</text>
  </g>

  <!-- Filter Chips -->
  <g transform="translate(16, 94)">
    <rect x="0" y="0" width="42" height="32" rx="16" fill="#F7F7F7" stroke="#E0E0E0"/>
    <line x1="13" y1="12" x2="29" y2="12" stroke="#1A1C20" stroke-width="1.6"/>
    <line x1="16" y1="16" x2="26" y2="16" stroke="#1A1C20" stroke-width="1.6"/>
    <line x1="19" y1="20" x2="23" y2="20" stroke="#1A1C20" stroke-width="1.6"/>

    <rect x="50" y="0" width="76" height="32" rx="16" fill="#FFF0F6" stroke="#E21B70"/>
    <text x="88" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">Sort ▾</text>

    <rect x="134" y="0" width="76" height="32" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="172" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Offers</text>

    <rect x="218" y="0" width="92" height="32" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="264" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">Rating 4.5+</text>

    <rect x="318" y="0" width="60" height="32" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="348" y="21" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#1A1C20">catpro</text>
  </g>

  <text x="16" y="154" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#1A1C20">All restaurants (148)</text>

  <!-- Restaurant Card 1 -->
  <g transform="translate(16, 170)">
    <rect x="0" y="0" width="358" height="210" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="358" height="136" rx="14" fill="#3B2C35"/>
    <!-- Graphic Food Art -->
    <circle cx="179" cy="68" r="44" fill="#F5A623"/>
    <circle cx="179" cy="68" r="34" fill="#E21B70"/>
    <rect x="12" y="12" width="104" height="24" rx="4" fill="#E21B70"/>
    <text x="64" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Flat 30% OFF</text>
    <rect x="12" y="42" width="74" height="22" rx="4" fill="#2E3138"/>
    <text x="49" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF">catpro</text>
    <rect x="284" y="104" width="62" height="24" rx="12" fill="#FFFFFF"/>
    <text x="315" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#1A1C20">20-30 min</text>

    <text x="12" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">The Purrfect Pizza Co.</text>
    <text x="346" y="158" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">★ 4.9 (2,400+)</text>
    <text x="12" y="178" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">$$$ • Italian, Woodfired Pizza, Pasta</text>
    <text x="12" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">Free delivery with catpro</text>
  </g>

  <!-- Restaurant Card 2 -->
  <g transform="translate(16, 396)">
    <rect x="0" y="0" width="358" height="210" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="358" height="136" rx="14" fill="#233D4D"/>
    <rect x="135" y="34" width="88" height="68" rx="12" fill="#FF9F1C"/>
    <rect x="12" y="12" width="90" height="24" rx="4" fill="#E21B70"/>
    <text x="57" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Rs. 250 OFF</text>
    <rect x="284" y="104" width="62" height="24" rx="12" fill="#FFFFFF"/>
    <text x="315" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#1A1C20">30-40 min</text>

    <text x="12" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">Whiskers Biryani House</text>
    <text x="346" y="158" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">★ 4.7 (850+)</text>
    <text x="12" y="178" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">$$ • Pakistani, Desi, Karahi</text>
    <text x="12" y="196" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Rs. 119 delivery fee</text>
  </g>

  <!-- Restaurant Card 3 Preview -->
  <g transform="translate(16, 622)">
    <rect x="0" y="0" width="358" height="140" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="358" height="136" rx="14" fill="#4A2C2A"/>
    <rect x="12" y="12" width="96" height="24" rx="4" fill="#E21B70"/>
    <text x="60" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Buy 1 Get 1</text>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EFEFEF" stroke-width="1"/>

    <g transform="translate(48, 14)">
      <path d="M12 3L4 9v12h16V9l-8-6z" fill="#E21B70" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">Food</text>
    </g>

    <g transform="translate(140, 14)">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Grocery</text>
    </g>

    <g transform="translate(235, 14)">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Search</text>
    </g>

    <g transform="translate(330, 14)">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Account</text>
    </g>
  </g>

</svg>