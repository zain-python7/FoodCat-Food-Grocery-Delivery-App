<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F7F7F7"/>
  <rect x="0" y="0" width="390" height="130" fill="#FFFFFF"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#1A1C20"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#1A1C20"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#1A1C20"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#1A1C20" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#1A1C20" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#1A1C20"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#1A1C20"/>
  </g>


  <!-- Profile Header -->
  <g transform="translate(16, 52)">
    <g transform="translate(26, 26)">
      
  <g id="foodcat-mascot">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#E21B70" stroke-width="2"/>
    <!-- Ears -->
    <polygon points="-14,-8 -16,-20 -5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="14,-8 16,-20 5,-14" fill="#F8A5C2" stroke="#2E3138" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Head -->
    <ellipse cx="0" cy="1" rx="16" ry="13" fill="#FAD2E1" stroke="#2E3138" stroke-width="1.5"/>
    <ellipse cx="0" cy="5" rx="11" ry="8" fill="#FFFFFF"/>
    <!-- Cap -->
    <path d="M-8,-11 C-8,-17 8,-17 8,-11 Z" fill="#2E3138"/>
    <rect x="-10" y="-12" width="20" height="3" rx="1.5" fill="#E21B70"/>
    <!-- Eyes -->
    <circle cx="-6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="-6.8" cy="-0.8" r="1" fill="#FFFFFF"/>
    <circle cx="6" cy="0" r="2.8" fill="#2E3138"/>
    <circle cx="5.2" cy="-0.8" r="1" fill="#FFFFFF"/>
    <!-- Nose & Smile -->
    <polygon points="-2,3 2,3 0,5.5" fill="#E21B70"/>
    <path d="M-4,6.5 Q-2,9 0,6.5 Q2,9 4,6.5" fill="none" stroke="#2E3138" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="-10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
    <ellipse cx="10" cy="4" rx="2.5" ry="1.3" fill="#F78FB3" opacity="0.7"/>
  </g>

    </g>
    <text x="66" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#1A1C20">Zack</text>
    <text x="66" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">View profile &amp; saved details</text>
    <text x="358" y="30" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">⚙</text>
  </g>

  <!-- CatPro Membership Banner -->
  <g transform="translate(16, 146)">
    <rect x="0" y="0" width="358" height="104" rx="14" fill="url(#darkCard)"/>
    <rect x="16" y="16" width="66" height="22" rx="6" fill="#E21B70"/>
    <text x="49" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">catpro</text>
    <text x="16" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Unlock FREE delivery &amp; extra 20% off</text>
    <text x="16" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#D1D5DB">Try 1 month free, then Rs. 249/mo →</text>
  </g>

  <!-- Quick Action Tiles -->
  <g transform="translate(16, 264)">
    <rect x="0" y="0" width="112" height="78" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="56" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">🧾</text>
    <text x="56" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">Orders</text>

    <rect x="123" y="0" width="112" height="78" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="179" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">♥</text>
    <text x="179" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">Favourites</text>

    <rect x="246" y="0" width="112" height="78" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="302" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">📍</text>
    <text x="302" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">Addresses</text>
  </g>

  <!-- Perks & Menu List -->
  <g transform="translate(16, 358)">
    <rect x="0" y="0" width="358" height="360" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <text x="18" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">🎟  Vouchers &amp; Offers</text>
    <rect x="282" y="18" width="58" height="22" rx="11" fill="#FFF0F6"/>
    <text x="311" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">3 new</text>
    <line x1="18" y1="54" x2="340" y2="54" stroke="#F2F2F2"/>

    <text x="18" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">💳  foodcat Pay &amp; Cards</text>
    <text x="340" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#70757A">Rs. 450 ›</text>
    <line x1="18" y1="106" x2="340" y2="106" stroke="#F2F2F2"/>

    <text x="18" y="138" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">🎁  Invite Friends (Get Rs. 400)</text>
    <text x="340" y="138" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#70757A">›</text>
    <line x1="18" y1="158" x2="340" y2="158" stroke="#F2F2F2"/>

    <text x="18" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">🏆  catrewards Points</text>
    <text x="340" y="190" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">1,250 pts ›</text>
    <line x1="18" y1="210" x2="340" y2="210" stroke="#F2F2F2"/>

    <text x="18" y="242" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">🎧  Help Center</text>
    <text x="340" y="242" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#70757A">›</text>
    <line x1="18" y1="262" x2="340" y2="262" stroke="#F2F2F2"/>

    <text x="18" y="294" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">📄  Terms &amp; Privacy</text>
    <text x="340" y="294" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#70757A">›</text>
    <line x1="18" y1="314" x2="340" y2="314" stroke="#F2F2F2"/>

    <text x="18" y="344" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">Log out</text>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EFEFEF" stroke-width="1"/>

    <g transform="translate(48, 14)">
      <path d="M12 3L4 9v12h16V9l-8-6z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Food</text>
    </g>

    <g transform="translate(140, 14)">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Grocery</text>
    </g>

    <g transform="translate(235, 14)">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Search</text>
    </g>

    <g transform="translate(330, 14)">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#E21B70" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">Account</text>
    </g>
  </g>

</svg>