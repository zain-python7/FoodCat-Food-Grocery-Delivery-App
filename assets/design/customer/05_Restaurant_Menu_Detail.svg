<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFFFFF"/>

  <!-- Hero Cover Image -->
  <rect x="0" y="0" width="390" height="210" fill="#2E3138"/>
  <circle cx="195" cy="115" r="65" fill="#E21B70" opacity="0.25"/>
  <circle cx="195" cy="115" r="42" fill="#F5A623"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <!-- Top Floating Action Buttons -->
  <g transform="translate(16, 48)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF"/>
    <path d="M21 12l-6 6 6 6" fill="none" stroke="#E21B70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="300" cy="18" r="18" fill="#FFFFFF"/>
    <path d="M300 25l-1.2-1.1C294.8 20.3 292 17.8 292 14.8c0-2.5 2-4.5 4.5-4.5 1.4 0 2.7.7 3.5 1.7.8-1 2.1-1.7 3.5-1.7 2.5 0 4.5 2 4.5 4.5 0 3-2.8 5.5-6.8 9.1L300 25z" fill="#E21B70"/>

    <circle cx="342" cy="18" r="18" fill="#FFFFFF"/>
    <circle cx="341" cy="17" r="5" fill="none" stroke="#1A1C20" stroke-width="1.8"/>
    <line x1="345" y1="21" x2="348" y2="24" stroke="#1A1C20" stroke-width="1.8"/>
  </g>

  <!-- Restaurant Info Header -->
  <g transform="translate(16, 224)">
    <text x="0" y="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#1A1C20">Meow Burgers &amp; Fries</text>
    <text x="0" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">1.4 km away • Rs. 99 delivery • Min. order Rs. 350</text>
    <text x="0" y="64" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">★ 4.8 <tspan font-weight="400" fill="#70757A">(1,200+ ratings)</tspan></text>
    <text x="358" y="64" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">See reviews</text>

    <!-- Delivery Time Pill -->
    <rect x="0" y="78" width="358" height="38" rx="8" fill="#FFF0F6"/>
    <text x="14" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">⚡ Delivery in 20–30 min</text>
    <text x="344" y="102" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#E21B70">Change</text>
  </g>

  <!-- Category Tabs -->
  <g transform="translate(0, 356)">
    <line x1="0" y1="36" x2="390" y2="36" stroke="#EFEFEF" stroke-width="1"/>
    <text x="16" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">Popular</text>
    <rect x="16" y="33" width="52" height="3" rx="1.5" fill="#E21B70"/>
    <text x="88" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="14" fill="#70757A">Smash Burgers</text>
    <text x="205" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="14" fill="#70757A">Loaded Fries</text>
    <text x="305" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="14" fill="#70757A">Drinks</text>
  </g>

  <!-- Section Title -->
  <g transform="translate(16, 412)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#1A1C20">🔥 Popular</text>
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Most ordered right now</text>

    <!-- Menu Item 1 -->
    <g transform="translate(0, 50)">
      <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">Double Whisker Smash Burger</text>
      <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Two juicy beef patties, cheddar cheese,</text>
      <text x="0" y="54" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">caramelized onions &amp; secret cat sauce.</text>
      <text x="0" y="78" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">Rs. 890 <tspan font-weight="400" font-size="12" fill="#70757A" text-decoration="line-through">Rs. 1,050</tspan></text>

      <rect x="262" y="4" width="96" height="86" rx="12" fill="#FFE8CC"/>
      <circle cx="310" cy="47" r="24" fill="#F5A623"/>
      <!-- Quantity Badge -->
      <rect x="292" y="68" width="60" height="28" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="305" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">−</text>
      <text x="322" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">2</text>
      <text x="339" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">+</text>
    </g>

    <line x1="0" y1="158" x2="358" y2="158" stroke="#EFEFEF" stroke-width="1"/>

    <!-- Menu Item 2 -->
    <g transform="translate(0, 174)">
      <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">Spicy Kitty Crispy Zinger</text>
      <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Crunchy golden chicken fillet, jalapenos,</text>
      <text x="0" y="54" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">iceberg lettuce &amp; smoky chipotle mayo.</text>
      <text x="0" y="78" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">Rs. 650</text>

      <rect x="262" y="4" width="96" height="86" rx="12" fill="#FAD2E1"/>
      <circle cx="310" cy="47" r="24" fill="#E21B70"/>
      <!-- Add Button -->
      <circle cx="342" cy="80" r="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <text x="342" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#E21B70">+</text>
    </g>
  </g>

  <!-- Sticky Bottom View Cart Bar -->
  <g transform="translate(16, 768)">
    <rect x="0" y="0" width="358" height="52" rx="12" fill="#E21B70" filter="url(#cardShadow)"/>
    <circle cx="28" cy="26" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="28" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">2</text>
    <text x="179" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">View your cart</text>
    <text x="342" y="31" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Rs. 1,780</text>
  </g>
</svg>