<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .semibold { font-weight: 600; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F7F7F7"/>

  <!-- Catmart Header -->
  <rect x="0" y="0" width="390" height="148" fill="#E21B70"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:16</text>
    <!-- Signal, Wifi, Battery -->
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <g transform="translate(16, 48)">
    <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">catmart</text>
    <rect x="92" y="3" width="84" height="20" rx="10" fill="#FFFFFF"/>
    <text x="134" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#E21B70">⚡ 20 MINS</text>
    <text x="0" y="36" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#FFE3EE">Delivering to Main Boulevard, Gulberg III</text>
  </g>

  <!-- Search Input -->
  <g transform="translate(16, 96)">
    <rect x="0" y="0" width="358" height="38" rx="19" fill="#FFFFFF"/>
    <text x="20" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#70757A">🔍 Search milk, eggs, snacks, fruits...</text>
  </g>

  <!-- Promo Strip -->
  <g transform="translate(16, 162)">
    <rect x="0" y="0" width="358" height="72" rx="12" fill="#FFF0F6" stroke="#FAD2E1"/>
    <text x="16" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#E21B70">Free delivery on orders above Rs. 799</text>
    <text x="16" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#1A1C20">Fresh produce &amp; daily essentials at supermarket prices</text>
  </g>

  <!-- Shop by Aisle Grid -->
  <g transform="translate(16, 250)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#1A1C20">Shop by aisle</text>

    <!-- Row 1 -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="56" cy="38" r="22" fill="#D8F3DC"/>
      <text x="56" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Fruits &amp; Veg</text>

      <rect x="123" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="179" cy="38" r="22" fill="#E0F2FE"/>
      <text x="179" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Dairy &amp; Eggs</text>

      <rect x="246" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="302" cy="38" r="22" fill="#FEF3C7"/>
      <text x="302" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Bakery</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="56" cy="38" r="22" fill="#FCE7F3"/>
      <text x="56" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Snacks</text>

      <rect x="123" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="179" cy="38" r="22" fill="#EDE9FE"/>
      <text x="179" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Beverages</text>

      <rect x="246" y="0" width="112" height="96" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <circle cx="302" cy="38" r="22" fill="#FFEDD5"/>
      <text x="302" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#1A1C20">Pet Care</text>
    </g>
  </g>

  <!-- Trending Essentials Carousel -->
  <g transform="translate(16, 502)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#1A1C20">Daily essentials</text>
    <text x="358" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">See all</text>

    <!-- Product Card 1 -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="112" height="176" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="80" height="72" rx="8" fill="#E0F2FE"/>
      <circle cx="94" cy="76" r="14" fill="#E21B70"/>
      <text x="94" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">+</text>
      <text x="10" y="106" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">Rs. 290</text>
      <text x="10" y="124" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Fresh Full Cream</text>
      <text x="10" y="138" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Milk 1 Liter</text>
      <text x="10" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="10" fill="#70757A">1 L</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(123, 28)">
      <rect x="0" y="0" width="112" height="176" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="80" height="72" rx="8" fill="#FEF3C7"/>
      <circle cx="94" cy="76" r="14" fill="#E21B70"/>
      <text x="94" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">+</text>
      <text x="10" y="106" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">Rs. 360</text>
      <text x="10" y="124" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Farm Fresh</text>
      <text x="10" y="138" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Brown Eggs</text>
      <text x="10" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="10" fill="#70757A">12 pcs</text>
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(246, 28)">
      <rect x="0" y="0" width="112" height="176" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="16" y="14" width="80" height="72" rx="8" fill="#D8F3DC"/>
      <circle cx="94" cy="76" r="14" fill="#E21B70"/>
      <text x="94" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">+</text>
      <text x="10" y="106" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">Rs. 180</text>
      <text x="10" y="124" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Organic</text>
      <text x="10" y="138" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#1A1C20">Bananas</text>
      <text x="10" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="10" fill="#70757A">1 Dozen</text>
    </g>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EFEFEF" stroke-width="1"/>

    <g transform="translate(48, 14)">
      <path d="M12 3L4 9v12h16V9l-8-6z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Food</text>
    </g>

    <g transform="translate(140, 14)">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" fill="#E21B70" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">Grocery</text>
    </g>

    <g transform="translate(235, 14)">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Search</text>
    </g>

    <g transform="translate(330, 14)">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Account</text>
    </g>
  </g>

</svg>