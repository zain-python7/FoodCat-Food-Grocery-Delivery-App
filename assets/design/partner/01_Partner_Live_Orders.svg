  <!-- Incoming Order Card 2 -->
  <g transform="translate(16, 470)">
    <rect x="0" y="0" width="358" height="210" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="16" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#1A1C20">#FC-89416</text>
    <rect x="116" y="14" width="76" height="22" rx="11" fill="#FFF0F6"/>
    <text x="154" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">⏱ 02:30</text>
    <text x="342" y="30" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Rs. 1,300</text>
