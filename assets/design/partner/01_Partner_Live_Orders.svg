    <text x="179" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Accept Order (15 min)</text>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
