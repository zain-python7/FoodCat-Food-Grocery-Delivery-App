    <text x="154" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">⏱ 01:45</text>
    <text x="342" y="34" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Rs. 2,020</text>

    <text x="16" y="56" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Customer: Sarah K. • Paid Online</text>
