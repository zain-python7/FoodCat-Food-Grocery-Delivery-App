    <text x="34" y="112" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">+ Extra Cheddar Slice, No Onions</text>

    <text x="16" y="138" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">1x Loaded Kitty Fries</text>
    <text x="34" y="156" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">+ Jalapenos</text>

