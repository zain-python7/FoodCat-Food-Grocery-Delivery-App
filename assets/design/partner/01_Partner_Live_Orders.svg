      <text x="107" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#E21B70">15 min</text>
      <rect x="148" y="-2" width="66" height="26" rx="8" fill="#F7F7F7"/>
      <text x="181" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">20 min</text>
      <rect x="222" y="-2" width="66" height="26" rx="8" fill="#F7F7F7"/>
      <text x="255" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">25 min</text>
    </g>

    <!-- Action Buttons -->
