    <rect x="0" y="0" width="358" height="6" rx="3" fill="#E21B70"/>

    <text x="16" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#1A1C20">#FC-89415</text>
