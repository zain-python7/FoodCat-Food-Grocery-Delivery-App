    </g>
    <text x="50" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Meow Burgers &amp; Fries</text>
    <text x="50" y="35" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#10B981">● Accepting orders • Gulberg III</text>
    <!-- Online Pill Toggle -->
