    <circle cx="343" cy="23" r="11" fill="#FFFFFF"/>
    <text x="308" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">OPEN</text>
  </g>

  <!-- Status Filter Tabs -->
  <g transform="translate(16, 126)">
    <rect x="0" y="0" width="114" height="36" rx="18" fill="#E21B70"/>
    <text x="57" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">New (2)</text>

    <rect x="122" y="0" width="114" height="36" rx="18" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="179" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#1A1C20">Preparing (3)</text>

