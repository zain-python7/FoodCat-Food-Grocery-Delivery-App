<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#1A1C20"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:20</text>
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <!-- Top Timer Ring -->
  <g transform="translate(195, 118)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#374151" stroke-width="6"/>
    <path d="M0,-42 A42,42 0 1,1 -36,21" fill="none" stroke="#E21B70" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">24s</text>
  </g>

  <text x="195" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">New Delivery Request!</text>

  <!-- Request Card -->
  <g transform="translate(16, 214)">
    <rect x="0" y="0" width="358" height="470" rx="18" fill="#FFFFFF"/>

    <!-- Payout Hero -->
    <rect x="0" y="0" width="358" height="106" rx="18" fill="#FFF0F6"/>
    <text x="179" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">ESTIMATED EARNINGS</text>
    <text x="179" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#1A1C20">Rs. 260</text>
    <text x="179" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#10B981">Includes Rs. 60 Peak Surge + Rs. 50 Tip</text>

    <!-- Distance & Time Badges -->
    <g transform="translate(24, 126)">
      <rect x="0" y="0" width="148" height="44" rx="10" fill="#F7F7F7"/>
      <text x="74" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">📍 3.2 km total</text>

      <rect x="162" y="0" width="148" height="44" rx="10" fill="#F7F7F7"/>
      <text x="236" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">⏱ ~18 mins</text>
    </g>

    <!-- Route Timeline -->
    <g transform="translate(24, 198)">
      <circle cx="10" cy="10" r="8" fill="#2E3138"/>
      <line x1="10" y1="22" x2="10" y2="74" stroke="#CCCCCC" stroke-width="2" stroke-dasharray="4,4"/>
      <text x="30" y="14" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#70757A">PICKUP (0.8 km away)</text>
      <text x="30" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">Meow Burgers &amp; Fries</text>
      <text x="30" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Main Boulevard, Gulberg III</text>

      <circle cx="10" cy="86" r="8" fill="#E21B70"/>
      <text x="30" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">DROP-OFF (2.4 km)</text>
      <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">House 42-B, Block E-1</text>
      <text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Gulberg III, Lahore • Paid Online</text>
    </g>

    <!-- Accept / Decline Buttons -->
    <g transform="translate(20, 384)">
      <rect x="0" y="0" width="96" height="54" rx="12" fill="#F7F7F7"/>
      <text x="48" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#70757A">Decline</text>

      <rect x="108" y="0" width="210" height="54" rx="12" fill="#E21B70"/>
      <text x="213" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Accept Delivery</text>
    </g>
  </g>
</svg>