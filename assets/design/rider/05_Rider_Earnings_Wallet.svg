<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F7F7F7"/>
  <rect x="0" y="0" width="390" height="96" fill="#FFFFFF"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#1A1C20">10:20</text>
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#1A1C20"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#1A1C20"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#1A1C20"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#1A1C20" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#1A1C20" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#1A1C20"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#1A1C20"/>
  </g>


  <g transform="translate(16, 52)">
    <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#1A1C20">Rider Wallet &amp; Earnings</text>
  </g>

  <!-- Wallet Balance Card -->
  <g transform="translate(16, 112)">
    <rect x="0" y="0" width="358" height="148" rx="16" fill="url(#darkCard)"/>
    <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="12" fill="#D1D5DB">Available Balance</text>
    <text x="20" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF">Rs. 18,450</text>
    <rect x="20" y="92" width="146" height="36" rx="18" fill="#E21B70"/>
    <text x="93" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Instant Cashout</text>
    <text x="338" y="114" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#10B981">JazzCash / Bank</text>
  </g>

  <!-- Weekly Quest Progress -->
  <g transform="translate(16, 276)">
    <rect x="0" y="0" width="358" height="106" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="16" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">🏆 Weekend Quest Bonus</text>
    <text x="342" y="30" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">+Rs. 1,500</text>
    <text x="16" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Complete 40 deliveries before Sunday 11:59 PM</text>
    <rect x="16" y="68" width="326" height="10" rx="5" fill="#EFEFEF"/>
    <rect x="16" y="68" width="260" height="10" rx="5" fill="#E21B70"/>
    <text x="342" y="94" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#1A1C20">32 / 40 completed</text>
  </g>

  <!-- Recent Trips Breakdown -->
  <g transform="translate(16, 398)">
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#1A1C20">Recent Deliveries</text>
    <rect x="0" y="28" width="358" height="240" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <text x="16" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">#FC-89412 • Meow Burgers</text>
    <text x="16" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">10:15 AM • 3.2 km • Base + Surge</text>
    <text x="342" y="66" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#10B981">+Rs. 260</text>
    <line x1="16" y1="94" x2="342" y2="94" stroke="#F2F2F2"/>

    <text x="16" y="122" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">#FC-89398 • Catmart Gulberg</text>
    <text x="16" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">09:42 AM • 2.1 km • Grocery Express</text>
    <text x="342" y="130" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#10B981">+Rs. 210</text>
    <line x1="16" y1="158" x2="342" y2="158" stroke="#F2F2F2"/>

    <text x="16" y="186" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#1A1C20">#FC-89381 • Purrfect Pizza Co.</text>
    <text x="16" y="204" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">09:05 AM • 4.5 km • Customer Tip Rs. 100</text>
    <text x="342" y="194" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#10B981">+Rs. 340</text>
  </g>

  
  <g id="bottom-nav" transform="translate(0, 772)" filter="url(#navShadow)">
    <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#EFEFEF" stroke-width="1"/>

    <g transform="translate(48, 14)">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Shift</text>
    </g>

    <g transform="translate(140, 14)">
      <path d="M19 7c0-1.1-.9-2-2-2h-3v2h3v2.65L13.52 14H10V9H6c-2.21 0-4 1.79-4 4v3h2c0 1.66 1.34 3 3 3s3-1.34 3-3h4.48L19 10.35V7zM7 17c-.55 0-1-.45-1-1h2c0 .55-.45 1-1 1z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Deliveries</text>
    </g>

    <g transform="translate(235, 14)">
      <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" fill="#E21B70" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">Earnings</text>
    </g>

    <g transform="translate(330, 14)">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#70757A" transform="scale(0.95)"/>
      <text x="11" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#70757A">Profile</text>
    </g>
  </g>

</svg>