<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#F7F7F7"/>
  <rect x="0" y="0" width="390" height="104" fill="#E21B70"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:20</text>
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>


  <g transform="translate(16, 52)">
    <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Drop-off • #FC-89412</text>
    <text x="0" y="36" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#FFE3EE">Arrived at customer location</text>
  </g>

  <!-- Customer Card -->
  <g transform="translate(16, 120)">
    <rect x="0" y="0" width="358" height="146" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="16" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#1A1C20">Zack</text>
    <text x="16" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#70757A">House 42-B, Block E-1, Gulberg III</text>
    <rect x="16" y="64" width="326" height="32" rx="8" fill="#FFF0F6"/>
    <text x="26" y="84" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E21B70">📝 Note: Ring the second bell at the main gate</text>

    <g transform="translate(16, 108)">
      <text x="0" y="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">💬 Chat with Customer</text>
      <text x="326" y="18" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">📞 Call</text>
    </g>
  </g>

  <!-- Payment Collection Box -->
  <g transform="translate(16, 282)">
    <rect x="0" y="0" width="358" height="118" rx="14" fill="#2E3138"/>
    <text x="18" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#D1D5DB">PAYMENT STATUS</text>
    <text x="18" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#10B981">PAID ONLINE</text>
    <text x="18" y="92" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#FFFFFF">Do not collect cash from customer (Rs. 0 due)</text>
  </g>

  <!-- Proof of Delivery Photo Upload -->
  <g transform="translate(16, 416)">
    <rect x="0" y="0" width="358" height="156" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="16" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#1A1C20">Proof of Delivery</text>
    <rect x="16" y="46" width="326" height="90" rx="12" fill="#F7F7F7" stroke="#E21B70" stroke-dasharray="6,4"/>
    <text x="179" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#E21B70">📷 Take Handover Photo</text>
    <text x="179" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#70757A">Optional for direct handover</text>
  </g>

  <!-- Complete Delivery CTA -->
  <g transform="translate(16, 756)">
    <rect x="0" y="0" width="358" height="54" rx="12" fill="#10B981"/>
    <text x="179" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">✓ Complete Delivery (+Rs. 260)</text>
  </g>
</svg>