<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="navShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E21B70"/>
      <stop offset="100%" stop-color="#FF4791"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3138"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="#FFF0F6"/>

  <!-- Navigation Map -->
  <path d="M-20,250 Q160,220 240,310 T410,360" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <path d="M120,80 L190,540" fill="none" stroke="#FFFFFF" stroke-width="18"/>
  <path d="M150,410 L175,260 L265,240" fill="none" stroke="#E21B70" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Destination Restaurant Pin -->
  <g transform="translate(265, 240)">
    <circle cx="0" cy="0" r="18" fill="#2E3138"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Rider Arrow -->
  <g transform="translate(150, 410)">
    <circle cx="0" cy="0" r="22" fill="#E21B70"/>
    <polygon points="0,-10 -8,8 0,4 8,8" fill="#FFFFFF"/>
  </g>

  <!-- Top Turn-by-Turn Banner -->
  <rect x="0" y="0" width="390" height="126" fill="#2E3138"/>
  
  <g id="status-bar">
    <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">10:20</text>
    <rect x="315" y="18" width="3" height="10" rx="1" fill="#FFFFFF"/>
    <rect x="320" y="16" width="3" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="325" y="14" width="3" height="14" rx="1" fill="#FFFFFF"/>
    <rect x="330" y="12" width="3" height="16" rx="1" fill="#FFFFFF" opacity="0.35"/>
    <rect x="342" y="16" width="22" height="11" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="344" y="18" width="16" height="7" rx="1" fill="#FFFFFF"/>
    <rect x="365" y="19" width="2" height="5" rx="1" fill="#FFFFFF"/>
  </g>

  <g transform="translate(16, 48)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#E21B70"/>
    <text x="27" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF">↱</text>
    <text x="68" y="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">250 m</text>
    <text x="68" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#D1D5DB">Turn right onto Main Boulevard</text>
  </g>

  <!-- Bottom Pickup Action Sheet -->
  <path d="M0,515 Q0,495 20,495 L370,495 Q390,495 390,515 L390,844 L0,844 Z" fill="#FFFFFF" filter="url(#navShadow)"/>
  <g transform="translate(20, 522)">
    <rect x="0" y="0" width="118" height="24" rx="12" fill="#FFF0F6"/>
    <text x="59" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#E21B70">STEP 1: PICKUP</text>
    <text x="350" y="16" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">2 mins away</text>

    <text x="0" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" fill="#1A1C20">Meow Burgers &amp; Fries</text>
    <text x="0" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#70757A">Order #FC-89412 • 2 Items • Collect with PIN</text>

    <!-- Pickup Verification PIN Box -->
    <rect x="0" y="88" width="350" height="58" rx="12" fill="#F7F7F7"/>
    <text x="16" y="114" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#70757A">Show Restaurant Order PIN:</text>
    <text x="334" y="124" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#E21B70" letter-spacing="3">4829</text>

    <!-- Contact Restaurant -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="168" height="42" rx="10" fill="#FFF0F6"/>
      <text x="84" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#E21B70">📞 Call Restaurant</text>

      <rect x="182" y="0" width="168" height="42" rx="10" fill="#F7F7F7"/>
      <text x="266" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" fill="#1A1C20">🧾 Order Items</text>
    </g>

    <!-- Confirm Pickup Slider Button -->
    <rect x="0" y="222" width="350" height="54" rx="27" fill="#E21B70"/>
    <circle cx="29" cy="249" r="22" fill="#FFFFFF"/>
    <text x="29" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#E21B70">→</text>
    <text x="185" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Swipe to Confirm Pickup</text>
  </g>
</svg>